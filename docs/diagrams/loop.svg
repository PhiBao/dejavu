  <text x="64" y="684" fill="#5b5f66" font-size="8" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
  <line x1="160" y1="681" x2="182" y2="681" stroke="#5b5f66" stroke-width="1.4"/>
  <text x="188" y="684" fill="#5b5f66" font-size="8" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace">LOOP</text>
