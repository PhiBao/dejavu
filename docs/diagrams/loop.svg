  <path d="M 305.674,271.999 A 240,240 0 0 1 438.871,154.128" fill="none" stroke="#5b5f66" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 520.000,172.000 L 520.000,322.000" fill="none" stroke="#8b8f96" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
