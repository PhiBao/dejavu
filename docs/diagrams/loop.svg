<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" role="img" aria-labelledby="loop-title loop-desc">
  <title id="loop-title">The Dejavu learning loop</title>
  <desc id="loop-desc">Every recall records which memory earned the answer; importance is scored from usage and drives ranking and renewal priority, with each pass written back to memory on Walrus.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#5b5f66"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e4572e"/>
    </marker>
    <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8b8f96"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f7f7f5"/>
  <text x="64" y="40" fill="#8b8f96" font-size="7" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" letter-spacing="0.18em">LEARNING LOOP · MEMORIES THAT CHANGE THE PRODUCT</text>
  <text x="64" y="66" fill="#0f1115" font-size="24" font-family="'Instrument Serif', Georgia, serif">What Dejavu learns from being used</text>
