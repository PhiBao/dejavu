  <text x="292.0" y="305.0" fill="#0f1115" font-size="12" font-weight="600" font-family="'Geist', 'Inter', system-ui, sans-serif" text-anchor="middle">Renew</text>
  <text x="292.0" y="320.0" fill="#5b5f66" font-size="9" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" text-anchor="middle">before expiry</text>
