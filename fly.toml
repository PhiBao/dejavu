# Dejavu on Fly.io — minimum resources.
# One shared-cpu-1x 256MB machine in Singapore, scales to zero when idle
# (auto_start wakes it on the next request), 1GB volume for data/recall.json
# so the projection survives restarts and redeploys.
app = 'recall-walrus-memory'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '30s'
    interval = '60s'
    method = 'GET'
    path = '/api/health'
    protocol = 'http'
    timeout = '10s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'

[[mounts]]
  source = 'recall_data'
  destination = '/app/data'
